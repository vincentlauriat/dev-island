name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  pull-requests: write

jobs:
  build-and-release:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract version from tag
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Install dependencies
        run: |
          brew install create-dmg
          pip3 install --break-system-packages Pillow

      - name: Import signing certificate
        id: signing
        env:
          CERTIFICATE_P12: ${{ secrets.APPLE_CERTIFICATE_P12 }}
          CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          SKIP_NOTARIZE: ${{ vars.SKIP_NOTARIZE }}
        run: |
          # Decode the p12 certificate from base64
          CERT_FILE="$(mktemp).p12"
          echo "$CERTIFICATE_P12" | base64 --decode > "$CERT_FILE"

          # Create a temporary keychain
          KEYCHAIN_PATH="$RUNNER_TEMP/build.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          # Import the certificate (.p12 = identity = cert + private key)
          security import "$CERT_FILE" \
            -P "$CERTIFICATE_PASSWORD" \
            -A \
            -f pkcs12 \
            -k "$KEYCHAIN_PATH"
          security set-key-partition-list \
            -S apple-tool:,apple: \
            -k "$KEYCHAIN_PASSWORD" \
            "$KEYCHAIN_PATH"

          # Add the keychain to the search list
          security list-keychains -d user -s "$KEYCHAIN_PATH" $(security list-keychains -d user | tr -d '"')

          # A release is notarized unless SKIP_NOTARIZE is explicitly enabled.
          # Credential validation failures must stop the workflow before any
          # release assets or update metadata are published.
          if [[ "${SKIP_NOTARIZE:-}" == "true" ]]; then
            echo "Skipping notarytool credential setup because SKIP_NOTARIZE is true."
            echo "notary_ready=false" >> "$GITHUB_OUTPUT"
          else
            # Deliberately NOT named AppliMacVincentGithub. That profile lives in the maintainer's
            # login keychain and a runner can never reach it; this one is rebuilt from scratch on
            # every run out of the Apple secrets. Same credentials, different lifetime — keeping
            # the names distinct stops the two from being mistaken for each other.
            xcrun notarytool store-credentials "dev-island-notary" \
              --apple-id "${{ secrets.APPLE_ID }}" \
              --team-id "${{ secrets.APPLE_TEAM_ID }}" \
              --password "${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}" \
              --keychain "$KEYCHAIN_PATH"
            echo "notary_ready=true" >> "$GITHUB_OUTPUT"
          fi

          # Clean up
          rm -f "$CERT_FILE"

      - name: Check the Sparkle key pair is whole
        env:
          SPARKLE_EDDSA_KEY: ${{ secrets.SPARKLE_EDDSA_KEY }}
          DEV_ISLAND_EDDSA_PUBLIC_KEY: ${{ vars.DEV_ISLAND_EDDSA_PUBLIC_KEY }}
        run: |
          # Both halves, or neither. Half-configured is the state that fails silently: with only
          # the private secret set, the appcast ships EdDSA-signed updates while the packaged app
          # carries no SUPublicEDKey to validate them, and nothing in the log says so.
          if [[ -n "$SPARKLE_EDDSA_KEY" && -z "$DEV_ISLAND_EDDSA_PUBLIC_KEY" ]]; then
            echo "::error::SPARKLE_EDDSA_KEY is set but the DEV_ISLAND_EDDSA_PUBLIC_KEY variable is not."
            echo "Updates would be signed with a key the shipped app cannot verify. Set the public half:"
            echo "  gh variable set DEV_ISLAND_EDDSA_PUBLIC_KEY -R \"\$GITHUB_REPOSITORY\""
            exit 1
          fi
          if [[ -z "$SPARKLE_EDDSA_KEY" && -n "$DEV_ISLAND_EDDSA_PUBLIC_KEY" ]]; then
            echo "::error::DEV_ISLAND_EDDSA_PUBLIC_KEY is set but the SPARKLE_EDDSA_KEY secret is not."
            echo "The app would advertise a public key while no appcast entry ever gets signed."
            exit 1
          fi
          if [[ -z "$SPARKLE_EDDSA_KEY" ]]; then
            echo "Neither half set — shipping without auto-update. Intended pre-first-release state."
          else
            echo "Both halves set — auto-update enabled."
          fi

      - name: Build and package (signed)
        env:
          DEV_ISLAND_APP_NAME: "Dev Island"
          DEV_ISLAND_EDDSA_PUBLIC_KEY: ${{ vars.DEV_ISLAND_EDDSA_PUBLIC_KEY }}
          DEV_ISLAND_BUNDLE_ID: "app.devisland.DevIsland"
          DEV_ISLAND_VERSION: ${{ steps.version.outputs.version }}
          DEV_ISLAND_BUILD_NUMBER: ${{ github.run_number }}
          DEV_ISLAND_SIGN_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          # Empty on purpose. package-app.sh defaults to the AppliMacVincentGithub keychain
          # profile for local releases; a runner has no login keychain, so notarization here is
          # owned by the dedicated "Notarize" step below, against the throwaway profile the
          # signing step builds from the Apple secrets. Leave this unset and package-app.sh would
          # submit against a profile that does not exist on the runner.
          DEV_ISLAND_NOTARY_PROFILE: ""
          DEV_ISLAND_UNIVERSAL: "true"
        run: zsh scripts/package-app.sh

      - name: Verify artifacts
        run: |
          test -f "output/package/Dev Island.zip"
          test -f "output/package/Dev Island.dmg"
          ls -lh output/package/

      - name: Verify code signature
        run: |
          bundle="output/package/Dev Island.app"
          echo "--- Signature info ---"
          codesign -dvv "$bundle"
          echo ""
          echo "--- Signature verification ---"
          codesign --verify --deep --strict --verbose=2 "$bundle"

      - name: Verify bundle structure
        run: |
          bundle="output/package/Dev Island.app"
          echo "--- Bundle contents ---"
          find "$bundle" -maxdepth 3 -type f | sort

          # Required files
          for f in \
            "Contents/MacOS/DevIslandApp" \
            "Contents/Helpers/DevIslandHooks" \
            "Contents/Helpers/DevIslandSetup" \
            "Contents/Resources/DevIsland.icns" \
            "Contents/Resources/DevIsland_DevIslandApp.bundle" \
          ; do
            if [[ ! -e "$bundle/$f" ]]; then
              echo "::error::Missing required file: $f"
              exit 1
            fi
          done

          echo "Bundle structure OK"

      - name: Notarize
        if: vars.SKIP_NOTARIZE != 'true' && steps.signing.outputs.notary_ready == 'true'
        id: notarize
        env:
          DEV_ISLAND_APP_NAME: "Dev Island"
        run: |
          bundle="output/package/$DEV_ISLAND_APP_NAME.app"
          zip_path="output/package/$DEV_ISLAND_APP_NAME.zip"
          dmg_path="output/package/$DEV_ISLAND_APP_NAME.dmg"

          echo "Submitting for notarization..."
          xcrun notarytool submit "$zip_path" \
            --keychain-profile "dev-island-notary" \
            --wait --timeout 10m

          echo "Stapling app bundle..."
          xcrun stapler staple -v "$bundle"

          # Re-create zip with stapled bundle
          rm -f "$zip_path"
          ditto -c -k --keepParent "$bundle" "$zip_path"

          # Re-sign and notarize DMG
          codesign --force --sign "${{ secrets.APPLE_SIGNING_IDENTITY }}" --timestamp "$dmg_path"
          xcrun notarytool submit "$dmg_path" \
            --keychain-profile "dev-island-notary" \
            --wait --timeout 10m
          xcrun stapler staple -v "$dmg_path"

          echo "notarized=true" >> "$GITHUB_OUTPUT"

      - name: Sign update with EdDSA (Sparkle)
        id: sparkle_sign
        env:
          SPARKLE_EDDSA_KEY: ${{ secrets.SPARKLE_EDDSA_KEY }}
        run: |
          sign_tool=".build/artifacts/sparkle/Sparkle/bin/sign_update"
          zip_path="output/package/Dev Island.zip"

          if [[ -z "$SPARKLE_EDDSA_KEY" ]]; then
            echo "::warning::SPARKLE_EDDSA_KEY not set — skipping appcast update"
            echo "signed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # sign_update reads the private EdDSA key from stdin via --ed-key-file -
          sign_output="$(echo "$SPARKLE_EDDSA_KEY" | "$sign_tool" "$zip_path" --ed-key-file -)"
          ed_signature="$(echo "$sign_output" | sed -n 's/.*sparkle:edSignature="\([^"]*\)".*/\1/p')"
          length="$(echo "$sign_output" | sed -n 's/.*length="\([^"]*\)".*/\1/p')"

          echo "ed_signature=$ed_signature" >> "$GITHUB_OUTPUT"
          echo "length=$length" >> "$GITHUB_OUTPUT"
          echo "signed=true" >> "$GITHUB_OUTPUT"
          echo "EdDSA signature: $ed_signature (length: $length)"

      - name: Update appcast.xml
        if: steps.sparkle_sign.outputs.signed == 'true'
        run: |
          zsh scripts/update-appcast.sh \
            "${{ steps.version.outputs.version }}" \
            "${{ github.run_number }}" \
            "${{ steps.sparkle_sign.outputs.ed_signature }}" \
            "${{ steps.sparkle_sign.outputs.length }}"
          cat appcast.xml

      - name: Update appcast.xml via PR
        if: steps.sparkle_sign.outputs.signed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          branch="chore/appcast-v${{ steps.version.outputs.version }}"
          # Save the updated appcast.xml before switching branches
          cp appcast.xml /tmp/appcast.xml
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git checkout -f -b "$branch" origin/main
          cp /tmp/appcast.xml appcast.xml
          git add appcast.xml
          git commit -m "chore: update appcast.xml for v${{ steps.version.outputs.version }}"
          git push --force origin "$branch"
          gh pr create \
            --base main \
            --head "$branch" \
            --title "chore: update appcast.xml for v${{ steps.version.outputs.version }}" \
            --body "Automated appcast.xml update from release workflow."
          gh pr merge "$branch" --merge --admin --delete-branch

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "Dev Island $GITHUB_REF_NAME" \
            --generate-notes \
            --notes-start-tag "$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo '')" \
            --draft \
            "output/package/Dev Island.dmg#Dev Island.dmg (macOS, Universal)" \
            "output/package/Dev Island.zip#Dev Island.zip (macOS, Universal)"

      - name: Append install instructions to release notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NOTARIZED: ${{ steps.notarize.outputs.notarized }}
        run: |
          existing="$(gh release view "$GITHUB_REF_NAME" --json body -q .body)"
          if [[ "$NOTARIZED" == "true" ]]; then
            install_note="> This build is signed and notarized by Apple. It will launch without Gatekeeper warnings."
          else
            install_note="> This build is signed with a Developer ID certificate. On first launch, right-click → **Open** to bypass Gatekeeper."
          fi
          gh release edit "$GITHUB_REF_NAME" --notes "$(cat <<EOF
          ${existing}

          ---

          ## Installation

          1. Download **Dev Island.dmg**, open it, and drag **Dev Island** to **Applications**.
          2. Requires **macOS 14+** (Apple Silicon and Intel).

          ${install_note}
          EOF
          )"

      # Disabled in this fork: the step below opens and self-merges a PR against
      # Octane0411/homebrew-tap, which is upstream's tap, not ours. Kept rather than deleted so
      # upstream rebases stay conflict-free. To ship a Dev Island cask, repoint it at a tap this
      # repo owns and flip the condition back.
      - name: Update Homebrew tap cask
        if: false
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if [[ -z "${GH_TOKEN}" ]]; then
            echo "::warning::HOMEBREW_TAP_TOKEN not set — skipping homebrew tap update"
            exit 0
          fi

          dmg_path="output/package/Dev Island.dmg"
          sha256="$(shasum -a 256 "$dmg_path" | awk '{print $1}')"
          echo "DMG sha256: $sha256"

          workdir="$(mktemp -d)"
          git clone "https://x-access-token:${GH_TOKEN}@github.com/Octane0411/homebrew-tap.git" "$workdir/tap"
          cd "$workdir/tap"

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          branch="bump/devisland-v${VERSION}"
          git checkout -b "$branch"

          sed -i '' \
            -e "s/^  version \".*\"/  version \"${VERSION}\"/" \
            -e "s/^  sha256 \".*\"/  sha256 \"${sha256}\"/" \
            Casks/devisland.rb

          if git diff --quiet; then
            echo "Cask already at v${VERSION}, nothing to do"
            exit 0
          fi

          git add Casks/devisland.rb
          git commit -m "devisland: bump to v${VERSION}"
          git push --force origin "$branch"

          gh pr create \
            --repo Octane0411/homebrew-tap \
            --base main \
            --head "$branch" \
            --title "devisland: bump to v${VERSION}" \
            --body "Automated bump from https://github.com/vincentlauriat/dev-island/releases/tag/v${VERSION}"
          gh pr merge "$branch" --repo Octane0411/homebrew-tap --merge --delete-branch

      - name: Refresh contributors image cache via PR
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          timestamp="$(date +%s)"
          branch="chore/contributors-v${{ steps.version.outputs.version }}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git checkout -f -b "$branch" origin/main
          for file in README.md README.zh-CN.md; do
            sed -i '' "s|contrib.rocks/image?repo=vincentlauriat/dev-island&t=[0-9]*|contrib.rocks/image?repo=vincentlauriat/dev-island\&t=${timestamp}|g" "$file"
          done
          if git diff --quiet; then
            echo "No contributors timestamp changes detected, skipping."
            exit 0
          fi
          git add README.md README.zh-CN.md
          git commit -m "chore: refresh contributors image cache for v${{ steps.version.outputs.version }}"
          git push --force origin "$branch"
          gh pr create \
            --base main \
            --head "$branch" \
            --title "chore: refresh contributors image cache for v${{ steps.version.outputs.version }}" \
            --body "Automated contrib.rocks cache-bust from release workflow."
          gh pr merge "$branch" --merge --admin --delete-branch

      - name: Cleanup keychain
        if: always()
        run: |
          KEYCHAIN_PATH="$RUNNER_TEMP/build.keychain-db"
          security delete-keychain "$KEYCHAIN_PATH" 2>/dev/null || true
