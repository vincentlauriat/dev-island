name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - 'feat/**'
      - 'fix/**'
      - 'docs/**'
      - 'refactor/**'
      - 'chore/**'
      - 'investigate/**'

jobs:
  harness:
    runs-on: macos-26

    steps:
      - uses: actions/checkout@v4

      # Fork-specific guard. The rebrand is regenerated, never hand-resolved, so a sync that
      # forgets to re-run scripts/rebrand.sh must fail loudly rather than ship a half-renamed
      # tree. See docs/fork-sync.md. Runs first: it is instant and the failure is unambiguous.
      - name: Verify rebrand is fully applied
        run: bash scripts/rebrand.sh --check

      # Key parity and printf format specifiers across every .lproj, for the macOS bundles
      # and both Xcode targets. Neither swift build nor xcodebuild can see these failures: a
      # missing key renders as the raw key at runtime, and a dropped or reordered %@ makes
      # String(format:) read arguments that were never pushed.
      - name: Verify localization bundles are in sync
        run: python3 scripts/check-localization.py

      - name: Show Swift Version
        run: swift --version

      - name: Run CI checks
        run: zsh scripts/harness.sh ci

  package-verify:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          brew install create-dmg
          pip3 install --break-system-packages Pillow

      - name: Build and package
        run: zsh scripts/package-app.sh

      # Bundle structure is verified inside package-app.sh itself.
      # No separate verify step needed — the script exits non-zero on
      # missing files.
